<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>새벽 빵집</title>
<style>
  :root { --paper:#f4efe6; --ink:#2a2622; --glow:0; }
  html,body { margin:0; height:100%; background:var(--paper); transition:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; }
  svg { width:100%; max-width:1000px; height:auto; touch-action:none; user-select:none; }
  .ln { fill:none; stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .fl { fill:var(--paper); stroke:var(--ink); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .thin { stroke-width:1; }
  .ink { fill:var(--ink); stroke:none; }
  .hit { cursor:pointer; }
  .steam path { fill:none; stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; opacity:0;
                stroke-dasharray:30; animation:rise 3.2s ease-in infinite; }
  .steam path:nth-child(2){ animation-delay:1s } .steam path:nth-child(3){ animation-delay:2s }
  @keyframes rise { 0%{opacity:0; stroke-dashoffset:30; transform:translateY(0)}
                    30%{opacity:.8} 100%{opacity:0; stroke-dashoffset:-10; transform:translateY(-26px)} }
  #tail { transform-origin:0 0; animation:wag 2.4s ease-in-out infinite; }
  @keyframes wag { 50%{ transform:rotate(18deg) } }
  #bubble text { font-size:13px; fill:var(--ink); text-anchor:middle; }
  #bubble { opacity:0; transition:opacity .25s; pointer-events:none; }
  #hint { position:fixed; bottom:12px; left:0; right:0; text-align:center; font-size:13px; color:var(--ink); opacity:.55; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 800 450" aria-label="새벽 빵집 선화 애니메이션">
  <!-- sky: stars -->
  <g id="stars" opacity="0"></g>

  <!-- sun / moon -->
  <path id="arc" class="ln thin" stroke-dasharray="2 8" d="M60 250 Q400 -60 740 250"/>
  <g id="sun" class="hit">
    <circle r="26" fill="transparent"/>
    <circle id="sunDisc" r="16" class="fl"/>
    <g id="rays"></g>
  </g>

  <!-- ground -->
  <path class="ln" d="M0 380 H800"/>
  <path class="ln thin" d="M0 392 H800 M0 404 H800" opacity=".5"/>
  <g id="cobbles" class="ln thin" opacity=".5"></g>

  <!-- bakery building -->
  <g id="bakery">
    <!-- chimney -->
    <rect class="fl" x="560" y="70" width="28" height="70"/>
    <path class="ln thin" d="M556 70 H592"/>
    <g class="steam" transform="translate(574 62)">
      <path d="M0 0 q-8 -10 0 -18 q8 -8 0 -16"/>
      <path d="M4 0 q-8 -10 0 -18 q8 -8 0 -16"/>
      <path d="M-4 0 q-8 -10 0 -18 q8 -8 0 -16"/>
    </g>
    <!-- body -->
    <rect class="fl" x="250" y="150" width="400" height="230"/>
    <!-- roof -->
    <path class="fl" d="M230 150 L450 80 L670 150 Z"/>
    <g class="ln thin" id="tiles"></g>
    <!-- sign -->
    <rect class="fl" x="370" y="162" width="160" height="34" rx="3"/>
    <text x="450" y="187" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">새벽 빵집</text>
    <!-- awning -->
    <path class="fl" d="M270 210 H630 L650 250 H250 Z"/>
    <g class="ln thin" id="awn"></g>
    <!-- window (left) -->
    <rect id="win" class="fl" x="280" y="262" width="150" height="100"/>
    <rect id="winGlow" x="282" y="264" width="146" height="96" fill="#ffcf6b" opacity="0"/>
    <path class="ln thin" d="M355 262 V362 M280 312 H430"/>
    <!-- sill -->
    <path class="fl" d="M272 362 H438 V370 H272 Z"/>
    <!-- door -->
    <rect class="fl" x="500" y="262" width="100" height="118"/>
    <rect id="doorGlow" x="506" y="270" width="88" height="50" fill="#ffcf6b" opacity="0"/>
    <rect class="ln thin" x="506" y="270" width="88" height="50"/>
    <circle class="ink" cx="586" cy="330" r="3"/>
    <!-- oven in window: arched oven with steam -->
    <g transform="translate(318 330)">
      <path class="ln" d="M0 32 V10 Q0 -6 16 -6 Q32 -6 32 10 V32 Z"/>
      <path class="ln thin" d="M8 32 V16 Q8 8 16 8 Q24 8 24 16 V32"/>
    </g>
    <g class="steam" transform="translate(334 320)">
      <path d="M0 0 q-6 -8 0 -14 q6 -6 0 -12"/>
      <path d="M5 0 q-6 -8 0 -14 q6 -6 0 -12"/>
      <path d="M-5 0 q-6 -8 0 -14 q6 -6 0 -12"/>
    </g>
  </g>

  <!-- cat on sill -->
  <g id="cat" class="hit" transform="translate(395 362)">
    <rect x="-30" y="-44" width="70" height="48" fill="transparent"/>
    <path class="fl" d="M-18 0 Q-22 -22 -4 -26 Q14 -28 16 -10 Q18 0 14 0 Z"/>
    <circle class="fl" cx="-6" cy="-32" r="10"/>
    <path class="fl" d="M-14 -39 L-12 -49 L-6 -41 M0 -41 L5 -49 L6 -38"/>
    <circle id="eyeL" class="ink" cx="-10" cy="-33" r="1.5"/>
    <circle id="eyeR" class="ink" cx="-2" cy="-33" r="1.5"/>
    <path class="ln thin" d="M-8 -28 l2 2 l2 -2 M-14 -29 l-6 -1 M-14 -27 l-6 2 M0 -29 l6 -1 M0 -27 l6 2"/>
    <g transform="translate(14 -4)"><path id="tail" class="ln" d="M0 0 Q18 -4 22 -20 Q24 -28 16 -30"/></g>
  </g>

  <!-- street lamp -->
  <g id="lamp">
    <path class="ln" d="M720 380 V270 Q720 255 705 255"/>
    <rect class="fl" x="694" y="255" width="22" height="22" rx="4"/>
    <circle id="lampGlow" cx="705" cy="266" r="40" fill="#ffcf6b" opacity="0"/>
  </g>

  <!-- baker -->
  <g id="baker" class="hit" transform="translate(150 380)">
    <rect x="-24" y="-92" width="48" height="94" fill="transparent"/>
    <g id="flip">
      <g id="legs">
        <path id="legA" class="ln" d="M0 -30 L0 0"/>
        <path id="legB" class="ln" d="M0 -30 L0 0"/>
      </g>
      <g id="upper">
        <path class="fl" d="M-9 -30 Q-12 -58 0 -62 Q12 -58 9 -30 Z"/>
        <path class="ln thin" d="M-9 -44 H9"/>
        <circle class="fl" cx="0" cy="-72" r="9"/>
        <path class="fl" d="M-9 -78 Q-12 -92 0 -92 Q12 -92 9 -78 Z"/>
        <circle class="ink" cx="3" cy="-72" r="1.2"/>
        <!-- arm + tray -->
        <path class="ln" d="M2 -56 L16 -46"/>
        <g id="tray" transform="translate(16 -46)">
          <path class="ln" d="M-4 0 H30"/>
          <path class="fl" d="M2 0 Q4 -10 12 -10 Q20 -10 22 0 Z"/>
          <path class="fl" d="M18 0 Q20 -7 25 -7 Q30 -7 30 0 Z"/>
        </g>
      </g>
    </g>
  </g>

  <!-- speech bubble -->
  <g id="bubble">
    <rect id="bb" class="fl" x="-44" y="-24" width="88" height="26" rx="12"/>
    <path class="fl" d="M-6 2 L0 10 L6 2"/>
    <text id="bt" y="-6"></text>
  </g>
</svg>
<div id="hint">해를 끌어 시간을 바꾸고, 제빵사 · 고양이 · 창문을 눌러 보세요</div>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const svg = $('s');
const mk = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

// decorations ---------------------------------------------------
for (let x = 0; x < 800; x += 36) mk('path', { d: `M${x} 392 v12` }, $('cobbles'));
for (let i = 0; i < 9; i++) mk('path', { d: `M${268 + i*20} 120 L${440 + i*11} ${100 + i*2}` , opacity: 0 }, $('tiles'));
for (let y = 112; y < 148; y += 8) mk('path', { d: `M${450 - (y-80)*3.14} ${y} H${450 + (y-80)*3.14}` }, $('tiles'));
for (let x = 270; x <= 630; x += 30) mk('path', { d: `M${x} 210 L${x - 4 - (x-450)*0.02*0} 250` }, $('awn'));
for (let i = 0; i < 28; i++) mk('circle', { cx: Math.random()*800, cy: Math.random()*200, r: 0.8 + Math.random()*1.2, fill: '#fff' }, $('stars'));
for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6;
  mk('path', { class: 'ln thin', d: `M${Math.cos(a)*21} ${Math.sin(a)*21} L${Math.cos(a)*29} ${Math.sin(a)*29}` }, $('rays')); }

// time of day ---------------------------------------------------
let t = 0.28;          // 0..1 along arc; light = sin(pi t)
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const DAY_P = [244,239,230], NIGHT_P = [20,26,48], DAY_I = [42,38,34], NIGHT_I = [225,228,240];
function setTime(v) {
  t = Math.min(1, Math.max(0, v));
  const light = Math.sin(Math.PI * t);
  const k = Math.min(1, Math.max(0, (0.45 - light) / 0.35));   // 0 day .. 1 night
  const root = document.documentElement.style;
  root.setProperty('--paper', `rgb(${mix(DAY_P, NIGHT_P, k)})`);
  root.setProperty('--ink',   `rgb(${mix(DAY_I, NIGHT_I, k)})`);
  const x = 60 + 680 * t;
  const y = (1-t)*(1-t)*250 + 2*(1-t)*t*(-60) + t*t*250;       // point on quad Bezier
  $('sun').setAttribute('transform', `translate(${x} ${y})`);
  $('rays').style.opacity = 1 - k;
  $('sunDisc').style.fill = k > .5 ? 'var(--ink)' : 'var(--paper)';
  $('sunDisc').setAttribute('r', k > .5 ? 12 : 16);
  $('stars').setAttribute('opacity', k * .9);
  for (const id of ['winGlow','doorGlow']) $(id).setAttribute('opacity', k * .75);
  $('lampGlow').setAttribute('opacity', k * .35);
  document.body.style.background = 'var(--paper)';
}
let dragging = false;
function pointerT(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  setTime((q.x - 60) / 680);
}
$('sun').addEventListener('pointerdown', e => { dragging = true; e.preventDefault(); });
window.addEventListener('pointermove', e => { if (dragging) pointerT(e); });
window.addEventListener('pointerup', () => dragging = false);

// speech bubble --------------------------------------------------
let bubbleTimer;
function say(text, x, y) {
  $('bt').textContent = text;
  const w = Math.max(70, text.length * 14 + 24);
  $('bb').setAttribute('x', -w/2); $('bb').setAttribute('width', w);
  $('bubble').setAttribute('transform', `translate(${x} ${y})`);
  $('bubble').style.opacity = 1;
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => $('bubble').style.opacity = 0, 1600);
}

// baker walk ------------------------------------------------------
let bx = 150, dir = 1, pause = 0, hop = 0, last = performance.now(), phase = 0;
const LEFT = 120, RIGHT = 690;
function leg(el, a) { el.setAttribute('d', `M0 -30 L${Math.sin(a)*14} ${-Math.abs(Math.cos(a))*3}`); }
function frame(now) {
  const dt = Math.min(50, now - last) / 1000; last = now;
  if (pause > 0) { pause -= dt; leg($('legA'), 0); leg($('legB'), 0); }
  else {
    bx += dir * 45 * dt; phase += dt * 7;
    leg($('legA'), phase); leg($('legB'), phase + Math.PI);
    if (bx > RIGHT || bx < LEFT) { dir *= -1; bx = Math.min(RIGHT, Math.max(LEFT, bx)); pause = 0.8; }
  }
  hop = Math.max(0, hop - dt * 3);
  const bob = Math.abs(Math.sin(phase)) * 2 - Math.sin(hop * Math.PI) * 14;
  $('baker').setAttribute('transform', `translate(${bx} ${380 - (pause > 0 ? 0 : bob) + (hop ? -Math.sin(hop*Math.PI)*14 + bob : 0)})`);
  $('flip').setAttribute('transform', `scale(${dir} 1)`);
  $('tray').setAttribute('transform', `translate(16 ${-46 + Math.sin(phase * 2) * 1.2 - hop * 6})`);
  // cat blink
  const blink = (now % 4000) < 140;
  $('eyeL').setAttribute('r', blink ? 0.4 : 1.5); $('eyeR').setAttribute('r', blink ? 0.4 : 1.5);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

$('baker').addEventListener('click', () => {
  hop = 1; pause = 1.4;
  say('갓 구운 빵!', bx, 380 - 118);
});
$('cat').addEventListener('click', () => say('야옹~', 395, 362 - 56));
$('win').addEventListener('click', () => say('오븐 따끈따끈', 355, 255));
$('win').style.cursor = 'pointer';

setTime(t);
</script>
</body>
</html>
