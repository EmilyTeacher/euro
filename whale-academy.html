<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>고래 영어학원 거리</title>
<style>
  :root { --bg:#f3eee3; --wall:#f7f2e7; --plate:#fbf8ef; --ink:#2b2724; --roofA:#7a4a3a; --roofB:#3f5f60; --roofC:#5c6670;
          --street:#efe6d6; --winOff:#efe9dc; --winLit:#f3ecd9; --bus:#e0b030; --bri:1; }
  html,body { margin:0; min-height:100%; background:#e9e6df; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:12px;
         font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding:12px 0; box-sizing:border-box; }
  svg { width:100%; max-width:1100px; height:auto; touch-action:manipulation; user-select:none; -webkit-user-select:none;
        filter:drop-shadow(0 10px 18px rgba(60,50,40,.22)); }
  .o { stroke:var(--ink); stroke-width:1; stroke-linejoin:round; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  .l { fill:none; stroke:var(--ink); stroke-width:.8; stroke-linecap:round; vector-effect:non-scaling-stroke; }
  .wall{fill:var(--wall)} .plate{fill:var(--plate)} .rA{fill:var(--roofA)} .rB{fill:var(--roofB)} .rC{fill:var(--roofC)}
  .wl{fill:var(--winLit)} .wo{fill:var(--winOff)} .ink{fill:var(--ink);stroke:none}
  .sgt { font-family:Georgia,"Noto Serif KR","Times New Roman",serif; font-weight:700; text-anchor:middle; fill:var(--ink); letter-spacing:.5px; }
  #label { font-family:Georgia,"Noto Serif KR",serif; font-size:11px; font-weight:700; fill:var(--ink); }
  .hit { cursor:pointer; }
  .people { filter:brightness(var(--bri)); }
  .cloud { animation:drift 80s linear infinite alternate; opacity:.55; }
  .cloud.b { animation-duration:110s; animation-direction:alternate-reverse; }
  @keyframes drift { from{transform:translateX(-40px)} to{transform:translateX(70px)} }
  #bubble { opacity:0; transition:opacity .25s; pointer-events:none; }
  #bubble text { font-size:10px; text-anchor:middle; font-weight:600; fill:var(--ink); }
  #ctl { display:flex; align-items:center; gap:10px; width:min(560px,90%); color:#6b645a; font-size:13px; }
  #ctl input { flex:1; accent-color:#7a4a3a; }
  #ctl button { border:1px solid #bfb8aa; background:#f7f3ea; border-radius:8px; padding:4px 12px; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 800 460" aria-label="고래 영어학원 거리 선화 애니메이션">
  <defs>
    <clipPath id="card"><rect x="16" y="16" width="768" height="428" rx="14"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <symbol id="wh" viewBox="0 0 24 12"><path d="M1.5 8 C1.5 3 8 1 13 2 C16 2.5 18 4 19.5 5 C20.5 3 22.5 1.5 23.5 2 C23 4.5 22 6 20.5 7 C22 7.5 23 9 23.5 10.5 C21.5 10.5 20 9.5 19 8.5 C16 11 8 12 1.5 8 Z" fill="var(--wall)" stroke="var(--ink)" stroke-width="1" stroke-linejoin="round"/><circle cx="6" cy="6" r=".9" fill="var(--ink)"/></symbol>
  </defs>
  <rect x="16" y="16" width="768" height="428" rx="14" fill="var(--bg)"/>
  <g clip-path="url(#card)">
    <g id="stars"></g>
    <g id="sunmoon"></g>
    <g id="clouds">
      <g class="cloud"><path class="l" d="M90 70 q8 -9 18 -4 q8 -11 22 -2 q12 -4 14 6 M80 78 H150"/></g>
      <g class="cloud b"><path class="l" d="M560 52 q8 -9 18 -4 q8 -11 22 -2 q12 -4 14 6 M552 60 H620"/></g>
      <g class="cloud b"><path class="l" d="M420 96 h60 M436 103 h38"/></g>
    </g>
    <g id="bld"></g>
    <!-- street -->
    <rect x="16" y="360" width="768" height="90" fill="var(--street)"/>
    <path class="l" d="M16 360 H784 M16 376 H784"/>
    <path class="l" style="opacity:.5" d="M16 408 H70 M110 408 H170 M210 408 H270 M310 408 H370 M410 408 H470 M510 408 H570 M610 408 H670 M710 408 H784 M40 428 H120 M300 432 H400 M600 428 H700"/>
    <g id="glows" filter="url(#blur)"></g>
    <!-- street lamps -->
    <g id="lamps"></g>
    <g id="tree"></g>
    <g id="people" class="people"></g>
    <g id="vehicles" class="people"></g>
    <g id="bubble">
      <rect id="bb" class="plate o" x="-44" y="-22" width="88" height="22" rx="10"/>
      <path class="plate o" d="M-5 0 L0 7 L5 0"/>
      <text id="bt" y="-7"></text>
    </g>
    <text id="label" x="34" y="42"></text>
  </g>
</svg>
<div id="ctl"><button id="pp" aria-label="재생/일시정지">⏸</button><input id="rng" type="range" min="0" max="24" step="0.01" value="9"><span id="hh"></span></div>

<script>
const $ = id => document.getElementById(id);
const svg = $('s');
const rnd = (a, b) => a + Math.random()*(b-a);
const GROUND = 360;

/* ================= BUILDINGS ================= */
let B = '', GL = '';
const win = (x, y, w, h, lit = Math.random() < .55) => {
  if (lit) GL += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#f3bd6e"/>`;
  return `<rect class="${lit?'wl':'wo'} o" x="${x}" y="${y}" width="${w}" height="${h}"/>
          <path class="l" d="M${x+w/2} ${y}V${y+h}M${x} ${y+h*.45}H${x+w}"/><path class="o plate" d="M${x-2} ${y+h}h${w+4}v3h-${w+4}z"/>`;
};
const sign = (x, y, w, h, text, size, icon) => `<rect class="plate o" x="${x}" y="${y}" width="${w}" height="${h}"/>` +
  (icon ? `<use href="#wh" x="${x+4}" y="${y+h/2-4.5}" width="16" height="8"/>` : '') +
  `<text class="sgt" x="${x + w/2 + (icon?9:0)}" y="${y + h/2 + size*.36}" font-size="${size}">${text}</text>`;
function gable(xl, xr, top, bot, slant, cls) {
  let s = `<path class="${cls} o" d="M${xl} ${bot} L${xl+slant} ${top} H${xr-slant} L${xr} ${bot} Z"/>`;
  for (let y = top + 5; y < bot; y += 5) { const k = (y-top)/(bot-top); s += `<path class="l" style="opacity:.3" d="M${xl+slant*(1-k)+2} ${y} H${xr-slant*(1-k)-2}"/>`; }
  return s;
}
const board = (x, y, w, h, t) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--roofB)" class="o"/><text class="sgt" x="${x+w/2}" y="${y+h/2+3}" font-size="8" style="fill:#f3efe4;font-weight:600">${t}</text>`;
const books = (x, y, w) => { let s = '', cols = ['#a5483c','#3f6a73','#c79a3b','#5d5a86','#7a4a3a']; for (let i = 0; i < w; i += 5) { const h = 9 + (i*7)%6; s += `<rect x="${x+i}" y="${y-h}" width="4" height="${h}" fill="${cols[(i/5)%5|0]}" stroke="var(--ink)" stroke-width=".5"/>`; } return s + `<path class="l" d="M${x-1} ${y} h${w+2}"/>`; };

// ---- A: beginner house (brown roof, dormer)
B += `<rect class="wall o" x="24" y="208" width="150" height="152"/>`;
B += gable(16, 182, 176, 208, 28, 'rA');
B += `<rect class="wall o" x="88" y="164" width="34" height="26"/><path class="rA o" d="M84 166 L105 148 L126 166 Z"/>` + win(98, 168, 14, 18);
B += win(40, 220, 40, 28) + win(112, 220, 40, 28) + win(40, 258, 40, 28) + win(112, 258, 40, 28);
B += sign(34, 294, 130, 16, 'BEGINNER · 초급반', 8.5, true);
B += `<rect class="wl o" x="34" y="318" width="78" height="40"/>` + board(42, 324, 34, 20, 'A B C') + `<path class="l" d="M44 354 h60 M82 332 q10 -8 18 0 v14 h-18 z"/>`;
B += `<rect class="plate o" x="122" y="320" width="30" height="40"/><path class="l" d="M137 320 V360 M122 336 H152"/><circle class="ink" cx="132" cy="342" r="1.6"/>`;

// ---- B: main academy (tallest, clock tower)
B += `<rect class="wall o" x="180" y="120" width="196" height="240"/><rect class="rC o" x="174" y="110" width="208" height="10"/>`;
B += `<rect class="wall o" x="262" y="78" width="40" height="32"/><path class="rB o" d="M258 78 L282 60 L306 78 Z"/>`;
B += `<circle class="plate o" cx="282" cy="94" r="10"/><path class="l" d="M282 94 V88 M282 94 L287 97"/><path class="l" d="M282 60 V52"/>`;
B += `<g id="vane" class="hit"><rect x="268" y="40" width="28" height="16" fill="transparent"/><use href="#wh" x="270" y="42" width="24" height="12"/></g>`;
B += sign(196, 126, 164, 20, '고래 영어학원', 13);
[152, 190, 228].forEach(y => [198, 256, 314].forEach(x => B += win(x, y, 46, 30)));
B += sign(226, 264, 124, 14, 'WHALE ENGLISH ACADEMY', 6.8);
B += `<rect class="wl o" x="192" y="284" width="58" height="72"/>` + board(198, 290, 46, 26, 'Hello!') + `<path class="l" d="M200 346 h42 M206 346 v-14 h30 v14"/>`;
B += `<path class="wl o" d="M258 360 V314 Q258 292 278 292 Q298 292 298 314 V360 Z"/><path class="l" d="M278 292 V360 M258 330 H298"/><circle class="ink" cx="274" cy="336" r="1.4"/><circle class="ink" cx="282" cy="336" r="1.4"/>`;
B += `<rect class="wl o" x="308" y="284" width="56" height="72"/>` + books(314, 312, 44) + books(314, 334, 44) + books(314, 352, 44);
B += `<path class="l" d="M376 300 h6"/><circle class="plate o" cx="388" cy="300" r="9"/><use href="#wh" x="381" y="296" width="14" height="7"/>`;

// ---- C: speaking cafe (teal roof, awning)
B += `<rect class="wall o" x="382" y="190" width="150" height="170"/>`;
B += gable(376, 538, 160, 190, 26, 'rB');
B += win(398, 202, 44, 32) + win(472, 202, 44, 32) + win(398, 246, 44, 32) + win(472, 246, 44, 32);
B += sign(394, 286, 124, 15, 'SPEAKING · CAFÉ', 8);
B += `<rect class="wl o" x="392" y="324" width="92" height="34"/><path class="l" d="M412 324 V334 M412 334 a6 4 0 0 0 12 0 M450 324 V332 M444 332 h12 l-3 6 h-6 z"/>` + `<path class="o plate" d="M394 352 h86"/><rect x="460" y="344" width="6" height="8" fill="#c79a3b" class="o"/><rect x="470" y="346" width="6" height="6" fill="#a5483c" class="o"/>`;
for (let i = 0; i < 7; i++) B += `<path class="o ${i%2?'plate':'rB'}" d="M${388+i*14.5} 306 h14.5 l${1+i*0.3-0.3} 14 h-14.5 z"/>`;
B += `<rect class="plate o" x="492" y="320" width="32" height="40"/><path class="l" d="M508 320 V360 M492 338 H524"/><circle class="ink" cx="503" cy="342" r="1.6"/>`;

// ---- D: library (modern, glass)
B += `<rect class="wall o" x="536" y="140" width="140" height="220"/><rect class="rC o" x="530" y="132" width="152" height="8"/><rect class="rC o" x="600" y="122" width="22" height="10"/><path class="l" d="M606 122 v-6 M616 122 v-9"/>`;
[150, 182].forEach(y => { B += `<rect class="wo o" x="548" y="${y}" width="116" height="26"/><path class="l" d="M577 ${y} v26 M606 ${y} v26 M635 ${y} v26"/>`; GL += `<rect x="550" y="${y+2}" width="112" height="22" fill="#9fd6e8" opacity=".5"/>`; });
B += sign(552, 216, 108, 16, 'LIBRARY · 도서관', 8.5, true) + sign(566, 238, 80, 12, 'OPEN 24H', 6.5);
B += `<rect class="wo o" x="548" y="266" width="38" height="94"/><rect class="wl o" x="590" y="266" width="38" height="94"/><rect class="wo o" x="632" y="266" width="32" height="94"/>`;
B += books(552, 300, 28) + books(552, 330, 28) + books(636, 300, 24) + books(636, 330, 24) + `<path class="l" d="M609 266 V360 M590 300 H628"/>`;

// ---- E: study room (brown roof)
B += `<rect class="wall o" x="682" y="214" width="98" height="146"/>`;
B += gable(674, 790, 176, 214, 22, 'rA');
B += win(696, 228, 32, 30) + win(740, 228, 32, 30);
B += sign(692, 274, 82, 14, 'STUDY · 자습실', 7.5);
B += `<rect class="wl o" x="692" y="296" width="46" height="62"/>` + books(698, 322, 34) + books(698, 348, 34) + `<path class="l" d="M744 300 q0 -4 4 -4 h20 q4 0 4 4"/>`;
B += `<rect class="plate o" x="746" y="300" width="28" height="60"/><path class="l" d="M760 300 V360"/>`;
// small roof birds
B += [[60,172],[250,108],[444,158],[610,120],[720,174]].map(([x,y]) => `<path class="l" d="M${x} ${y} q2 -4 4 0 q2 -4 4 0"/>`).join('');
$('bld').innerHTML = B;
$('glows').innerHTML = GL;

// street lamps
$('lamps').innerHTML = [378, 534, 674].map(x => `<path class="l" d="M${x} 360 V274 q0 -10 -8 -10"/><rect class="wl o" x="${x-14}" y="262" width="12" height="16" rx="2"/><circle class="lg" cx="${x-8}" cy="270" r="16" fill="#f3bd6e" opacity="0"/>`).join('');
// tree at right edge
$('tree').innerHTML = `<path class="l" d="M780 360 V300"/><circle class="plate o" cx="812" cy="268" r="30"/><path class="l" d="M786 268 q4 -6 10 -2"/>`;
// stars
$('stars').innerHTML = Array.from({length:44}, () => `<circle cx="${rnd(24,780)}" cy="${rnd(24,150)}" r="${rnd(.6,1.4)}" fill="#fff"/>`).join('');

/* ================= PALETTE / TIME ================= */
const K = [
 { h:0,    bg:'#181d38', wall:'#232843', plate:'#2c3252', ink:'#dfe3f2', roofA:'#33292f', roofB:'#243040', roofC:'#2f3445', street:'#1f2440', winOff:'#1c2038', winLit:'#f3bd6e', bus:'#8a6c24', bri:.62, n:1 },
 { h:5,    bg:'#1c2140', wall:'#262b46', plate:'#2f3555', ink:'#dfe3f2', roofA:'#352b32', roofB:'#26334a', roofC:'#313748', street:'#22274a', winOff:'#1f233c', winLit:'#f3bd6e', bus:'#8f7227', bri:.65, n:1 },
 { h:6.6,  bg:'#e9cdb4', wall:'#efdcc6', plate:'#f5e8d6', ink:'#2b2724', roofA:'#6d4034', roofB:'#3b5557', roofC:'#5a5f66', street:'#e6d1b8', winOff:'#e8d6bf', winLit:'#f5d79c', bus:'#d8a82e', bri:.94, n:.25 },
 { h:8.6,  bg:'#f3eee3', wall:'#f7f2e7', plate:'#fbf8ef', ink:'#2b2724', roofA:'#7a4a3a', roofB:'#3f5f60', roofC:'#5c6670', street:'#efe6d6', winOff:'#efe9dc', winLit:'#f3ecd9', bus:'#e0b030', bri:1, n:0 },
 { h:16,   bg:'#f3eee3', wall:'#f7f2e7', plate:'#fbf8ef', ink:'#2b2724', roofA:'#7a4a3a', roofB:'#3f5f60', roofC:'#5c6670', street:'#efe6d6', winOff:'#efe9dc', winLit:'#f3ecd9', bus:'#e0b030', bri:1, n:0 },
 { h:17.8, bg:'#e8c5a2', wall:'#f2dec4', plate:'#f7e9d3', ink:'#2b2724', roofA:'#6d4034', roofB:'#3b5557', roofC:'#5a5f66', street:'#ecd1b2', winOff:'#ecd5b9', winLit:'#f7d9a0', bus:'#d9a82e', bri:.96, n:.15 },
 { h:19.2, bg:'#3d3b63', wall:'#554d6c', plate:'#645b7a', ink:'#e4def0', roofA:'#4a3340', roofB:'#34475a', roofC:'#454a5e', street:'#34355a', winOff:'#3a3858', winLit:'#f6c77d', bus:'#b58c28', bri:.8, n:.75 },
 { h:20.8, bg:'#181d38', wall:'#232843', plate:'#2c3252', ink:'#dfe3f2', roofA:'#33292f', roofB:'#243040', roofC:'#2f3445', street:'#1f2440', winOff:'#1c2038', winLit:'#f3bd6e', bus:'#8a6c24', bri:.62, n:1 },
 { h:24,   bg:'#181d38', wall:'#232843', plate:'#2c3252', ink:'#dfe3f2', roofA:'#33292f', roofB:'#243040', roofC:'#2f3445', street:'#1f2440', winOff:'#1c2038', winLit:'#f3bd6e', bus:'#8a6c24', bri:.62, n:1 },
];
const hexRGB = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const lerp = (a,b,k) => a + (b-a)*k;
const mixHex = (a,b,k) => 'rgb(' + hexRGB(a).map((v,i) => Math.round(lerp(v, hexRGB(b)[i], k))).join(',') + ')';
const NAMES = ['bg','wall','plate','ink','roofA','roofB','roofC','street','winOff','winLit','bus'];
let hour = 9.2, playing = true, night = 0;
function applyTime(h) {
  let i = 0; while (i < K.length-2 && h > K[i+1].h) i++;
  const a = K[i], b = K[i+1], k0 = Math.min(1, Math.max(0, (h-a.h)/(b.h-a.h))), k = k0*k0*(3-2*k0);
  const r = document.documentElement.style;
  NAMES.forEach(n => r.setProperty('--'+n, mixHex(a[n], b[n], k)));
  r.setProperty('--bri', lerp(a.bri, b.bri, k));
  night = lerp(a.n, b.n, k);
  $('stars').setAttribute('opacity', Math.max(0, night - .25));
  $('glows').setAttribute('opacity', night * .55);
  document.querySelectorAll('.lg').forEach(e => e.setAttribute('opacity', night*.35));
  // sun / moon
  let sm = '';
  if (h >= 6 && h < 18) { const p = (h-6)/12; sm = `<g transform="translate(${40+720*p} ${64 - Math.sin(Math.PI*p)*38})"><circle r="11" fill="#f0c75e" stroke="var(--ink)" stroke-width="1"/></g>`; }
  else { const p = h >= 18 ? (h-18)/12 : (h+6)/12; sm = `<g transform="translate(${40+720*p} ${64 - Math.sin(Math.PI*p)*38})"><circle r="10" fill="#f1ecd9"/><circle cx="4" cy="-2" r="9" fill="var(--bg)"/></g>`; }
  $('sunmoon').innerHTML = sm;
  const hh = Math.floor(h) % 24, mm = Math.floor((h%1)*60);
  const period = h < 5 ? '새벽' : h < 11 ? '아침' : h < 16 ? '낮' : h < 18.5 ? '오후' : h < 21 ? '저녁' : '밤';
  $('label').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · ${period}`;
  $('rng').value = h; $('hh').textContent = '';
}

/* ================= PEOPLE ================= */
const people = [];
const SK = '#f2e2cc';
function mkPerson(o) {
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'hit');
  const long = o.long, c = o.coat;
  g.innerHTML = `<g class="f">
    <rect x="-14" y="-76" width="28" height="78" fill="transparent"/>
    <path class="o la" fill="none"/><path class="o lb" fill="none"/>
    ${o.pack ? `<rect class="o" x="-13" y="-52" width="8" height="18" rx="2" style="fill:#7d6a55"/>` : ''}
    <path class="o" style="fill:${c}" d="${long ? 'M-10 -14 L-7 -52 Q0 -56 7 -52 L10 -14 Z' : 'M-8 -28 L-7 -52 Q0 -56 7 -52 L8 -28 Z'}"/>
    <path class="o ab" fill="none"/>
    <circle class="o" cx="0" cy="-62" r="7" style="fill:${SK}"/>
    <path style="fill:${o.hair||'#2a2622'}" d="M-7.5 -62 Q-8 -71 0 -70.5 Q8 -71 7.5 -62 Q3 -66 -7.5 -62 Z"/>
    ${o.bun ? '<circle cx="-6" cy="-70" r="3.4" style="fill:#2a2622"/>' : ''}
    ${o.glasses ? '<circle class="o" cx="3.5" cy="-61" r="2.8" fill="none"/>' : ''}
    <path class="o af" fill="none"/>
    ${o.bag ? `<rect class="o" x="6" y="-36" width="10" height="9" rx="1.5" style="fill:#8a5a3a"/>` : ''}
    ${o.books ? `<g transform="translate(9 -38)"><rect class="o" x="0" y="-5" width="13" height="4" fill="#a5483c"/><rect class="o" x="1" y="-9" width="11" height="4" fill="#3f6a73"/></g>` : ''}
  </g>`;
  $('people').appendChild(g);
  const p = Object.assign({ g, f: g.querySelector('.f'), la: g.querySelector('.la'), lb: g.querySelector('.lb'), ab: g.querySelector('.ab'), af: g.querySelector('.af'),
    x: rnd(60, 740), dir: Math.random() < .5 ? 1 : -1, v: rnd(14, 24), ph: rnd(0, 6), pause: 0, hop: 0, y: 372 }, o);
  g.addEventListener('click', () => { p.hop = 1; p.pause = 1.2; say(p.say, p.x, p.y - 74*p.sc - 6); });
  people.push(p); return p;
}
mkPerson({ sc:.62, coat:'#2f4a7a', long:true, glasses:true, bun:true, books:true, say:'Good morning, class!', x:200, v:17 });
mkPerson({ sc:.44, coat:'#c79a3b', pack:true, hair:'#4a3020', say:'Hi, teacher!', x:170, v:17 });
mkPerson({ sc:.40, coat:'#8a3b3b', pack:true, bun:true, say:'Look, a whale!', x:140, v:17 });
mkPerson({ sc:.58, coat:'#2f6a68', bag:true, say:'See you tomorrow!', x:470, v:20 });
mkPerson({ sc:.58, coat:'#7a4a3a', bag:true, glasses:true, say:'Nice weather!', x:600, v:15 });
mkPerson({ sc:.56, coat:'#8a8a93', long:true, hair:'#d8d8d8', say:'English is fun!', x:350, v:13 });
mkPerson({ sc:.56, coat:'#3a3f6a', say:'Library, please!', x:640, v:22 });
mkPerson({ sc:.42, coat:'#4a7a5a', pack:true, say:"I'm a student!", x:520, v:18 });

function renderPerson(p, moving) {
  const s = moving ? Math.sin(p.ph) : 0, c = moving ? Math.cos(p.ph) : 0;
  const foot = (sg) => `M${sg>0?1:-1} -28 L${sg*s*12} ${-1 - Math.max(0, -sg*c)*3}`;
  p.la.setAttribute('d', foot(1)); p.lb.setAttribute('d', foot(-1));
  p.ab.setAttribute('d', `M-1 -50 L${-s*6 - 2} -34`);
  p.af.setAttribute('d', p.books || p.bag ? 'M2 -50 L9 -38' : `M2 -50 L${s*6 + 3} -34`);
  const hop = p.hop > 0 ? Math.sin(p.hop*Math.PI)*8 : 0;
  p.g.setAttribute('transform', `translate(${p.x} ${p.y - hop}) scale(${p.sc})`);
  p.f.setAttribute('transform', `scale(${p.dir} 1)`);
}

/* ---- bike, dog, bus ---- */
const V = $('vehicles'); const NSV = 'http://www.w3.org/2000/svg';

  <g class="w2"><circle class="o" cx="14" cy="-9" r="9" fill="none"/><path class="l sp" d="M14 -18 V0 M5 -9 H23"/></g>
  <path class="o" fill="none" d="M-14 -9 L-4 -19 H9 L14 -9 M-4 -19 L0 -9 H-14 M9 -19 L7 -24"/>
  <path class="o" d="M-6 -22 L-3 -36 Q2 -40 6 -36 L4 -24 Z" style="fill:#3a5a8a"/><circle class="o" cx="3" cy="-44" r="6" style="fill:${SK}"/>
  <path d="M-3 -44 Q-3 -51 3 -50 Q9 -50 8 -44 Q4 -47 -3 -44 Z" style="fill:#2a2622"/><path class="o" fill="none" d="M4 -34 L12 -26"/></g>`;

  <path class="o" style="fill:#7a4a3a" d="M16 -22 l3 -4 l1 5 z"/><circle cx="15" cy="-19" r="1" class="ink"/>

/* ================= BUBBLE ================= */
let bt;
function say(text, x, y) {
  $('bt').textContent = text;
  const w = Math.max(60, text.length*6.2 + 22);
  $('bb').setAttribute('x', -w/2); $('bb').setAttribute('width', w);
  $('bubble').setAttribute('transform', `translate(${Math.min(760, Math.max(60, x))} ${Math.max(40, y)})`);
  $('bubble').style.opacity = 1; clearTimeout(bt); bt = setTimeout(() => $('bubble').style.opacity = 0, 1700);
}
$('vane').addEventListener('click', () => say('뿌우~ Welcome!', 282, 40));

/* ================= LOOP ================= */
let last = performance.now();
function step(o, dt, lo, hi) { o.x += o.dir*o.v*dt; if (o.x > hi || o.x < lo) { o.dir *= -1; o.x = Math.min(hi, Math.max(lo, o.x)); } }
function frame(now) {
  const dt = Math.min(50, now - last)/1000; last = now;
  if (playing) { hour = (hour + dt*0.25) % 24; applyTime(hour); }   // 1 hour = 4s
  people.forEach(p => {
    p.hop = Math.max(0, p.hop - dt*2.4);
    const moving = p.pause <= 0;
    if (moving) { step(p, dt, 36, 760); p.ph += dt*p.v*.42; if (Math.random() < dt*.04) p.pause = rnd(.8, 2.4); }
    else p.pause -= dt;
    renderPerson(p, moving);
  });
  // bike
  step(bk, dt, 40, 760); bk.ph += dt*bk.v*.3;
  bk.g.setAttribute('transform', `translate(${bk.x} ${bk.y}) scale(${bk.sc})`); bk.f.setAttribute('transform', `scale(${bk.dir} 1)`);
  [bk.w1, bk.w2].forEach((w, i) => w.setAttribute('transform', `rotate(${bk.ph*57*bk.dir} ${i ? 14 : -14} -9)`));
  // dog
  step(dg, dt, 40, 760); dg.ph += dt*dg.v*.5;
  const s = Math.sin(dg.ph);
  dg.la.setAttribute('d', `M-8 -10 L${-8+s*5} 0`); dg.lb.setAttribute('d', `M-4 -10 L${-4-s*5} 0`);
  dg.lc.setAttribute('d', `M6 -10 L${6-s*5} 0`); dg.ld.setAttribute('d', `M9 -10 L${9+s*5} 0`);
  dg.tl.setAttribute('d', `M-11 -15 q-5 -5 ${-6+Math.sin(dg.ph*3)*2} -9`);
  dg.g.setAttribute('transform', `translate(${dg.x} ${dg.y}) scale(${dg.sc})`); dg.f.setAttribute('transform', `scale(${dg.dir} 1)`);
  // bus
  bs.x += bs.v*dt; if (bs.x > 900) bs.x = -90;
  bs.g.setAttribute('transform', `translate(${bs.x} ${bs.y}) scale(${bs.sc})`);
  bs.g.querySelector('.hl').setAttribute('opacity', night*.55);
  requestAnimationFrame(frame);
}
applyTime(hour); requestAnimationFrame(frame);

$('pp').addEventListener('click', () => { playing = !playing; $('pp').textContent = playing ? '⏸' : '▶'; });
$('rng').addEventListener('input', e => { hour = parseFloat(e.target.value); applyTime(hour); });
window.setHour = h => { hour = h; applyTime(h); };
</script>
