<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고래영어학원의 하루</title>
<style>
  :root { color-scheme: light; }
  html,body { margin:0; background:#e8e5de; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
         font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; -webkit-text-size-adjust:100%; }
  #stage { position:relative; width:min(100vw, 1100px); aspect-ratio:16/9; container-type:inline-size; overflow:hidden; background:#cfe2ea;
           --ink:#4b4741; --cap:rgba(255,255,255,.78); --capInk:#3b3732; }
  @media (min-width:1120px){ #stage { border-radius:14px; box-shadow:0 10px 30px rgba(60,50,40,.2);} }
  svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .o  { fill:none; stroke:var(--ink); stroke-width:1; stroke-linecap:round; stroke-linejoin:round; }
  .lo { opacity:.5; }
  .win { cursor:pointer; outline:none; }
  .win .hit { fill:transparent; }
  .win:hover .fr, .win:focus-visible .fr, .win.sel .fr { stroke:#b8704a; stroke-width:2; }
  .sgn { font-weight:800; font-size:19px; text-anchor:middle; fill:var(--signInk); letter-spacing:1px; }
  /* overlays (real text, not baked into the art) */
  #tag { position:absolute; left:3cqw; top:2.4cqw; color:var(--ink); pointer-events:none; transition:opacity .3s; }
  #tag b { display:block; font-size:2.2cqw; font-weight:700; letter-spacing:.02em; }
  #tag small { display:block; font-size:1.3cqw; opacity:.65; margin-top:.2cqw; }
  #cap { position:absolute; left:50%; bottom:2.6cqw; transform:translateX(-50%); max-width:86%; padding:.7cqw 2cqw; border-radius:2cqw;
         background:var(--cap); color:var(--capInk); font-size:2.3cqw; font-weight:600; white-space:nowrap; pointer-events:none; opacity:0; }
  #scrim { position:absolute; left:0; right:0; bottom:0; height:38%; background:linear-gradient(to top, rgba(14,20,46,.78), rgba(14,20,46,0)); opacity:0; pointer-events:none; }
  #fin { position:absolute; left:0; right:0; bottom:3cqw; text-align:center; color:#f6efdc; opacity:0; pointer-events:none; }
  #fin h1 { margin:0; font-size:4cqw; font-weight:800; letter-spacing:.08em; }
  #fin p  { margin:.5cqw 0 0; font-size:2cqw; font-weight:500; }
  #fin small { display:block; margin-top:.6cqw; font-size:1.4cqw; opacity:.7; }
  /* controls */
  #ctl { display:flex; align-items:center; gap:10px; width:min(100vw - 24px, 640px); color:#6b645a; font-size:12px; padding-bottom:max(8px, env(safe-area-inset-bottom)); }
  #ctl button { border:1px solid #c4bdb0; background:#f7f3ea; color:#4b4741; border-radius:8px; width:34px; height:28px; font-size:13px; line-height:1; cursor:pointer; padding:0; }
  #ctl .txt { width:auto; padding:0 8px; font-size:11px; }
  #ctl input { flex:1; accent-color:#8a6a55; min-width:0; }
  #tm { min-width:64px; text-align:right; font-variant-numeric:tabular-nums; }
  body.clean #ctl { display:none; }
  body.clean { cursor:none; }
  #uihit { position:fixed; right:0; bottom:0; width:44px; height:44px; display:none; }
  body.clean #uihit { display:block; }
</style>
</head>

 <rect x="34" y="14" width="30" height="38" fill="#f6f2e6" stroke="${IK}" stroke-width=".8"/>
 <g stroke="${IK}" stroke-width=".7" opacity=".7"><path d="M38 21 H60 M38 26.4 H60 M38 31.8 H60 M38 37.2 H60 M38 42.6 H60 M38 48 H54"/></g>
 <rect id="Rhl" x="38" y="35.2" width="0" height="4" fill="#efd57a" opacity=".85"/>
 <g stroke="${IK}" stroke-width=".7" fill="#fffdf6"><rect x="36" y="56" width="30" height="8"/></g>
 <g stroke="${IK}" stroke-width=".7" fill="#fffdf6"><circle cx="41" cy="60" r="2.1"/><circle cx="48" cy="60" r="2.1"/><circle cx="55" cy="60" r="2.1"/><circle cx="62" cy="60" r="2.1"/></g>
 <circle id="Rans" cx="55" cy="60" r="1.5" fill="${IK}" opacity="0"/>
 <path id="Rck" d="M25 30 l2.4 2.6 l5 -6" fill="none" stroke="${ACC}" stroke-width="1.5" stroke-linecap="round" opacity="0"/>
 <path id="RsArm" fill="none" stroke="${ROSE}" stroke-width="3" stroke-linecap="round"/><circle id="RsHand" r="1.9" fill="${SK}"/>
 <g id="Rt"><path d="M64 62 Q72 55 80 62 L81 86 H63 Z" fill="${TEAL}" stroke="${IK}" stroke-width=".8"/><rect x="65" y="86" width="14" height="4" fill="#3a3a48"/>
   <circle id="Rth" cx="72" cy="50" r="6.2" fill="${SK}" stroke="${IK}" stroke-width=".8"/><path d="M65.8 49 Q66 42.6 72 42.8 Q78.2 42.6 78.2 49 Q74 46.4 65.8 49 Z" fill="${HAIR}"/></g>
 <path id="RtArm" fill="none" stroke="${TEAL}" stroke-width="3.2" stroke-linecap="round"/><circle id="RtHand" r="2" fill="${SK}"/>`
];
const winEls = [];
const DESC = ['글자 소리를 하나씩 익히고 이어 읽어요.', '영자신문을 읽고 한 문장을 내 목소리로 말해요.', '지문에서 답의 근거를 찾아 설명해요.'];
const SUB  = ['소리를 하나씩 모아, 단어로.', '오늘의 뉴스, 내 목소리로.', '답을 고르고, 근거까지.'];
const LAB  = ['오후 2:15 · 파닉스', '오후 5:10 · 영자신문', '오후 7:30 · 중·고등 독해'];
const NAMES = ['왼쪽 교실 창, 파닉스', '가운데 교실 창, 영자신문', '오른쪽 교실 창, 중·고등 독해'];
WX.forEach((x, i) => {
  const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'win'); g.setAttribute('tabindex', 0); g.setAttribute('role', 'button'); g.setAttribute('aria-label', NAMES[i] + ' — 누르면 이 수업으로 이동');
  g.innerHTML = `
    <rect x="${x-2}" y="${WY-2}" width="92" height="100" style="fill:var(--wall)" class="o"/>
    <g clip-path="url(#c${i})"><g class="int" transform="translate(${x+3} ${WY+3})">${interiors[i]}</g>
      <path d="M${x+3} ${WY+60} L${x+40} ${WY+3} H${x+52} L${x+3} ${WY+80} Z" fill="#fff" opacity=".1"/></g>
    <rect class="fr" x="${x+3}" y="${WY+3}" width="82" height="90" fill="none" style="stroke:var(--ink)" stroke-width="1.3"/>
    <rect x="${x-6}" y="${WY+96}" width="100" height="6" style="fill:var(--wall)" class="o"/>
    <rect class="hit" x="${x-6}" y="${WY-12}" width="100" height="130"/>`;
  $('wins').appendChild(g); winEls.push(g);
  g.addEventListener('click', () => selectWin(i));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectWin(i); } });
});
const G = id => $(id);
const IDS = {};
['Lroom','Lfloor','Lt','Lth','Lthh','LtArm','LtHand','Lc0','Lc1','Lc2','Lbr','Lk','Lkh','Lkhh','LkArm','LkHand',
 'Mroom','Mfloor','Mk','Mkh','Mul','MkArm','MkHand','Mb','Rroom','Rfloor','Rs','Rsh','Rhl','Rans','Rck','RsArm','RsHand','Rt','Rth','RtArm','RtHand'].forEach(k => IDS[k] = G(k));

/* ---------- lesson animation (small, slow) ---------- */
const arm = (el, s, t, bend = 5) => el.setAttribute('d', `M${s[0]} ${s[1]} Q${(s[0]+t[0])/2} ${(s[1]+t[1])/2 + bend} ${t[0]} ${t[1]}`);
const tr = (el, x, y) => el.setAttribute('transform', `translate(${x} ${y})`);

function lessonL(u, T) {
  const SX = [30, 44, 58], REST = [22, 66], PT = [[...REST]];
  const place = [.7, 1.4, 2.1], point = [2.7, 3.4, 4.1];
  // teacher hand
  let hand = REST, holding = -1;
  for (let k = 0; k < 3; k++) {
    const tgt = [SX[k]-7, 60];
    if (u >= place[k]-.55 && u < place[k]) { hand = lp(k ? [SX[k-1]-7, 60] : REST, tgt, 0); hand = lp(REST, tgt, ease(seg(u, place[k]-.55, place[k]))); holding = k; }
    else if (u >= place[k] && u < place[k]+.45) { hand = lp(tgt, REST, ease(seg(u, place[k], place[k]+.45))); }
  }
  arm(IDS.LtArm, [19, 60], hand); tr(IDS.LtHand, hand[0], hand[1]);
  // cards
  for (let k = 0; k < 3; k++) {
    const el = IDS['Lc'+k]; let pos = [SX[k], 58], op = 1;
    if (u < place[k]-.55) op = 0;
    else if (u < place[k]) pos = [hand[0]+7, hand[1]-2];
    const pk = u >= point[k] && u < point[k]+.7;
    el.setAttribute('opacity', op); tr(el, pos[0], pos[1]);
    el.firstElementChild.setAttribute('stroke', pk ? ACC : IK); el.firstElementChild.setAttribute('stroke-width', pk ? 1.6 : .8);
  }
  // child finger
  let P0 = [66, 64];
  for (let k = 0; k < 3; k++) if (u >= point[k] && u < point[k]+.7) { const prev = k ? [SX[k-1]+1, 47] : [66, 64]; P0 = lp(prev, [SX[k]+1, 47], ease(seg(u, point[k], point[k]+.22))); }
  if (u >= point[2]+.7) P0 = lp([SX[2]+1, 47], [66, 64], ease(seg(u, point[2]+.7, point[2]+1.1)));
  arm(IDS.LkArm, [67, 62], P0, 3); tr(IDS.LkHand, P0[0], P0[1]);
  IDS.Lbr.setAttribute('opacity', seg(u, 4.55, 5.0));
  const b = Math.sin(T*2.1)*.5; tr(IDS.Lth, 0, b); tr(IDS.Lthh, 0, b); tr(IDS.Lkh, 0, -b); tr(IDS.Lkhh, 0, -b);
}
function lessonM(u, T) {
  const REST = [30, 68];
  const k1 = ease(seg(u, 1.0, 3.4)), k2 = ease(seg(u, 3.5, 4.0));
  let F = lp([42, 70], [72, 49], k1); F[1] = lerp(70, 49, seg(u, .5, 1.0)); // rise to the line first
  if (u < 1.0) F = lp(REST, [42, 49], ease(seg(u, .5, 1.0)));
  if (u >= 3.4) F = lp([72, 49], REST, k2);
  arm(IDS.MkArm, [30, 61], F, 3); tr(IDS.MkHand, F[0], F[1]);
  IDS.Mul.setAttribute('width', 30*k1);
  const lift = ease(seg(u, 3.7, 4.2)), b = Math.sin(T*2)*.5;
  tr(IDS.Mkh, lerp(3, -1, lift), lerp(2, -2, lift) + b);
  IDS.Mb.setAttribute('opacity', seg(u, 4.3, 4.8)); tr(IDS.Mb, 4, 0);
}
function lessonR(u, T) {
  const REST = [30, 66], AN = [55, 60], HS = [38, 37.2], HE = [60, 37.2];
  let P0 = REST;
  if (u < .8) P0 = lp(REST, AN, ease(seg(u, .5, .8)));
  else if (u < 1.5) P0 = lp(AN, HS, ease(seg(u, 1.3, 1.5)));
  if (u >= 1.5 && u < 3.2) P0 = lp(HS, HE, ease(seg(u, 1.5, 3.2)));
  else if (u >= 3.2) P0 = lp(HE, REST, ease(seg(u, 3.3, 3.8)));
  if (u >= .8 && u < 1.3) P0 = AN;
  arm(IDS.RsArm, [24, 62], P0, 3); tr(IDS.RsHand, P0[0], P0[1]);
  IDS.Rans.setAttribute('opacity', seg(u, 1.0, 1.3));
  IDS.Rhl.setAttribute('width', 22*ease(seg(u, 1.5, 3.2)));
  const tp = ease(seg(u, 3.6, 4.3)), TH = lp([70, 72], [64.5, 38.6], tp);
  arm(IDS.RtArm, [67, 62], TH, 3); tr(IDS.RtHand, TH[0], TH[1]);
  IDS.Rck.setAttribute('opacity', seg(u, 4.6, 5.0));
  const b = Math.sin(T*2.3)*.5; tr(IDS.Rsh, 0, b); tr(IDS.Rth, 0, -b);
}

/* ---------- state / render ---------- */
let T = 0, playing = true, holdSeg = null, ended = false;
const STABLE = [[0, 5.4], [6.6, 12.4], [13.6, 20]], JUMP = [0, 6.6, 13.6];
const stage = $('stage');
function render() {
  const Tp = holdSeg !== null ? clamp(T, STABLE[holdSeg][0], STABLE[holdSeg][1]) : T;
  const p = palAt(Tp);
  const st = stage.style;
  ['sky1','sky2','cel','cloud','wall','roof','sign','signInk','side','sideRoof','sideWin','pave','road','room','floor','ink','shadow','cap','capInk'].forEach(k => st.setProperty('--'+k, p[k]));
  st.setProperty('--lampFill', mixCol('#f3ecd9', '#ffd98a', p.lamp));
  // celestial & stars
  $('cel').setAttribute('cy', p.celY); $('crs').setAttribute('cy', p.celY-3); $('crs').setAttribute('opacity', p.n);
  $('cel').setAttribute('r', lerp(13, 12, p.n));
  $('stars').setAttribute('opacity', Math.max(0, p.n - .35)*.8);
  // shadows
  $('shBld').setAttribute('points', `240,380 560,380 ${560-p.shLb},${380+p.shWd} ${240-p.shLb},${380+p.shWd}`); $('shBld').setAttribute('opacity', p.shOp);
  document.querySelectorAll('.sl').forEach(el => { const x = +el.dataset.x; el.setAttribute('d', `M${x} 406 L${x-p.shLamp} ${406+p.shLamp*.16}`); });
  $('shLamps').setAttribute('opacity', p.shOp*1.3);
  $('eave').setAttribute('height', p.eave);
  document.querySelectorAll('.halo').forEach(h => h.setAttribute('opacity', p.lamp*.16));
  $('pool').setAttribute('opacity', p.lit[2]*p.n*.12);
  $('swL').style.fill = mixCol(p.sideWin, '#d9b676', p.sideLit); $('swR').style.fill = mixCol(p.sideWin, '#d9b676', p.sideLit*.7);
  // classroom interiors
  ['L','M','R'].forEach((c, i) => {
    const lit = p.lit[i];
    IDS[c+'room'].setAttribute('fill', mixCol(p.room, '#f6c777', lit));
    IDS[c+'floor'].setAttribute('fill', mixCol(p.floor, '#b98c55', lit*.6));
    winEls[i].querySelector('.int').style.filter = `brightness(${1 - p.n*(1-lit)*.3})`;
  });
  lessonL(T, T); lessonM(T-6, T); lessonR(T-13, T);
  // overlays
  const idx = T < 6 ? 0 : T < 13 ? 1 : 2, fin = seg(T, 20.2, 20.9);
  $('tagT').textContent = LAB[holdSeg !== null ? holdSeg : idx];
  $('tag').style.opacity = 1 - fin;
  const cap = $('cap');
  if (holdSeg !== null) { cap.textContent = DESC[holdSeg]; cap.style.opacity = 1; }
  else {
    cap.textContent = SUB[idx];
    const s = [.5, 7.0, 14.0][idx], e = [5.6, 12.6, 19.6][idx];
    cap.style.opacity = T >= 20 ? 0 : seg(T, s, s+.4) * (1 - seg(T, e, e+.4));
  }
  $('scrim').style.opacity = fin; $('fin').style.opacity = fin;
  // controls
  $('rng').value = T;
  const sec = Math.floor(T); $('tm').textContent = `0:${String(sec).padStart(2,'0')} / 0:22`;
  $('pp').textContent = ended ? '↻' : playing ? '⏸' : '▶';
  winEls.forEach((w, i) => w.classList.toggle('sel', holdSeg === i));
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last)/1000); last = now;
  if (playing || holdSeg !== null) {
    T += dt;
    if (holdSeg !== null) { if (T > STABLE[holdSeg][1]) T = JUMP[holdSeg]; }
    else if (T >= TOTAL) { T = TOTAL; playing = false; ended = true; }
  }
  render(); requestAnimationFrame(frame);
}
function selectWin(i) { holdSeg = i; playing = false; ended = false; T = JUMP[i]; render(); }
$('pp').addEventListener('click', () => {
  if (ended || T >= TOTAL) { T = 0; ended = false; playing = true; holdSeg = null; }
  else if (playing) { playing = false; holdSeg = null; }
  else { playing = true; holdSeg = null; }
  render();
});
$('rng').addEventListener('input', e => { T = parseFloat(e.target.value); holdSeg = null; ended = false; if (T >= TOTAL) { ended = true; playing = false; } render(); });
document.addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean'); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('pp').click(); } });
$('hide').addEventListener('click', () => document.body.classList.add('clean'));
$('uihit').addEventListener('click', () => document.body.classList.remove('clean'));
if (/clean/.test(location.search + location.hash)) document.body.classList.add('clean');
window.setT = t => { T = t; holdSeg = null; playing = false; ended = false; render(); };
render(); requestAnimationFrame(frame);
</script>
